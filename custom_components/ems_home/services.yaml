set_last_session:
  name: Last charging session (test)
  description: Overwrites the stored last session so automations and the card can be tested without a real charge. The live counters are cleared and the values stay until a real charge starts.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one eMS Home when more than one is configured. Empty = all.
      selector:
        text:
    energy_kwh:
      name: Energy (kWh)
      description: Total energy of the session.
      example: 11.5
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
    energy_grid_kwh:
      name: Energy from the grid (kWh)
      description: Share drawn from the meter.
      example: 11.5
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
    energy_pv_kwh:
      name: Energy from solar (kWh)
      description: Share from PV and battery. Defaults to the remainder.
      example: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          unit_of_measurement: kWh
    duration_min:
      name: Duration (minutes)
      description: Time the car actually charged.
      example: 195
      selector:
        number:
          min: 0
          max: 100000
          step: 1
          unit_of_measurement: min
    cost:
      name: Cost (EUR)
      description: Leave empty to calculate it from the configured tariff.
      example: 4.03
      selector:
        number:
          min: 0
          max: 10000
          step: 0.01
          unit_of_measurement: EUR

test_notification:
  name: Send a test notification
  description: Fires the charging event and, if a notify service is configured, sends the message too – without touching the wallbox or the sensors.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one eMS Home when more than one is configured. Empty = all.
      selector:
        text:
    kind:
      name: Event
      description: Start of a charge or the finished summary.
      default: finish
      selector:
        select:
          options:
            - label: Ladevorgang gestartet
              value: start
            - label: Ladevorgang beendet
              value: finish
    send:
      name: Also send the message
      description: Off = only fire the event, so an automation can be tested on its own.
      default: true
      selector:
        boolean:

get_history:
  name: Get charging history
  description: Returns finished charges, newest first, the filtered total count and 6–24 calendar months of unfiltered summaries (default 12), oldest month first. Charges are assigned by their start time.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one loaded eMS Home. Empty = combine all loaded entries.
      selector:
        text:
    start:
      name: Start date or datetime
      description: Inclusive ISO date or datetime. Times without an offset use the Home Assistant time zone.
      example: "2026-11-01"
      selector:
        text:
    end:
      name: End date or datetime
      description: ISO date includes the entire day; ISO datetime is exclusive. Times without an offset use the Home Assistant time zone.
      example: "2026-11-30"
      selector:
        text:
    vehicle:
      name: Vehicle
      description: Exact vehicle name. Empty field omitted = all vehicles.
      selector:
        text:
    months:
      name: Chart months
      description: Number of unfiltered calendar months, including the current month.
      default: 12
      selector:
        number:
          min: 6
          max: 24
          step: 1
          mode: box
    limit:
      name: Page size
      description: Maximum number of sessions to return. The count is not limited.
      default: 20
      selector:
        number:
          min: 1
          max: 200
          step: 1
          mode: box
    offset:
      name: Offset
      description: Number of matching sessions to skip.
      default: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box

delete_session:
  name: Delete a charging session
  description: Permanently deletes exactly one history entry and immediately updates the period sensors. Does not change the stored last-session snapshot or control the wallbox.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one loaded eMS Home. Empty = find the first matching session across loaded entries.
      selector:
        text:
    session_id:
      name: Session ID
      description: The id returned in a get_history session. Returns deleted=false when not found.
      required: true
      selector:
        text:
    confirm:
      name: Confirm deletion
      description: Must explicitly be true. Missing or false confirmation is rejected without deleting anything.
      required: true
      selector:
        boolean:

export_history:
  name: Export charging history
  description: Exports all matching sessions without pagination to a private history-YYYYMMDD-HHMMSS file in the Home Assistant configuration directory under ems_home, never www. Returns the path; no download URL is exposed. CSV formula-like text is escaped for spreadsheet safety.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one loaded eMS Home. Empty = combine all loaded entries.
      selector:
        text:
    format:
      name: File format
      description: CSV contains display units and a header; JSON preserves the full stored session records.
      required: true
      selector:
        select:
          options:
            - csv
            - json
    start:
      name: Start date or datetime
      description: Inclusive ISO date or datetime. Times without an offset use the Home Assistant time zone.
      example: "2026-11-01"
      selector:
        text:
    end:
      name: End date or datetime
      description: ISO date includes the entire day; ISO datetime is exclusive. Times without an offset use the Home Assistant time zone.
      example: "2026-11-30"
      selector:
        text:

update_session:
  name: Correct a charging session
  description: Corrects vehicle, tariffs or a note on one stored session, e.g. when the car was not detected or a tariff changed retroactively. Correcting a price recalculates cost and saving from the stored energy; sessions that were already rolled into the monthly archive cannot be edited. Returns the updated record.
  fields:
    entry_id:
      name: Config entry (only for several devices)
      description: Targets one loaded eMS Home. Empty = first match across all loaded entries.
      selector:
        text:
    session_id:
      name: Session ID
      description: The id field of the stored session, as returned by Get charging history.
      required: true
      selector:
        text:
    vehicle:
      name: Vehicle
      description: Corrected vehicle name. Leave empty to clear it.
      selector:
        text:
    grid_price:
      name: Grid price per kWh
      description: New grid tariff for this session. Recalculates cost and saving.
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
    pv_price:
      name: PV price per kWh
      description: New PV tariff for this session. Recalculates cost and saving.
      selector:
        number:
          min: 0
          max: 10
          step: 0.01
          mode: box
    note:
      name: Note
      description: Free text up to 200 characters, e.g. a reason for the correction.
      selector:
        text:
