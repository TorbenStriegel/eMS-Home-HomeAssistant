<!DOCTYPE html><html><head><meta charset="utf-8"><title>pending</title>
<style>body{font-family:monospace;background:#111;color:#eee;padding:16px}</style></head>
<body><pre id="out">running…</pre>
<script>
class HaCard extends HTMLElement { constructor(){super();this.attachShadow({mode:"open"}).innerHTML="<slot></slot>";} }
customElements.define("ha-card", HaCard);
const S = (state, attrs = {}, lastChanged = new Date().toISOString()) =>
  ({ entity_id:"", state:String(state), attributes:attrs, last_changed:lastChanged });
const calls = [];
const EID = "01JABCDEF_";           // config entry id prefix

// entity ids exactly as they are on the real installation (device "controlroom")
const makeHass = ({ withRegistry = true, over = {}, lang = "de-DE" } = {}) => {
  const states = {
    "sensor.ems_home_grid_power": S("3.744"),
    "sensor.ems_home_ev_charging_power": S("3.453"),
    "sensor.ems_home_ev_charging_state": S("charging"),
    "sensor.ems_home_charge_mode": S("grid"),                 // <- decoy sensor
    "select.ems_home_charge_mode": S("grid", { options:["lock","grid","pv","hybrid"] }),
    "number.ems_home_min_pv_power_quota": S("90", { min:0, max:100, step:10 }),
    "sensor.ems_home_charging_session_duration": S("85.5"),
    "sensor.controlroom_ems_home_ladeenergie": S("0.0"),      // renamed by the device name
    "sensor.ems_home_wallbox_status": S("charging"),
    ...over,
  };
  for (const [id,o] of Object.entries(states)) o.entity_id = id;
  const registry = withRegistry ? {
    "sensor.ems_home_grid_power":               { entity_id:"sensor.ems_home_grid_power", platform:"ems_home", unique_id: EID+"grid_power_total" },
    "sensor.ems_home_ev_charging_power":        { entity_id:"sensor.ems_home_ev_charging_power", platform:"ems_home", unique_id: EID+"ev_charging_power_total" },
    "sensor.ems_home_ev_charging_state":        { entity_id:"sensor.ems_home_ev_charging_state", platform:"ems_home", unique_id: EID+"ev_charging_state" },
    "sensor.ems_home_charge_mode":              { entity_id:"sensor.ems_home_charge_mode", platform:"ems_home", unique_id: EID+"charge_mode" },
    "select.ems_home_charge_mode":              { entity_id:"select.ems_home_charge_mode", platform:"ems_home", unique_id: EID+"charge_mode_select" },
    "number.ems_home_min_pv_power_quota":       { entity_id:"number.ems_home_min_pv_power_quota", platform:"ems_home", unique_id: EID+"pv_quota_number" },
    "sensor.ems_home_charging_session_duration":{ entity_id:"sensor.ems_home_charging_session_duration", platform:"ems_home", unique_id: EID+"evse_session_duration" },
    "sensor.controlroom_ems_home_ladeenergie":  { entity_id:"sensor.controlroom_ems_home_ladeenergie", platform:"ems_home", unique_id: EID+"evse_session_energy" },
  } : {};
  return { states, entities: registry, locale:{language: lang}, language: lang.slice(0,2),
           callService:(d,s,p)=>calls.push({d,s,p}) };
};

const log = [];
const check = (name, ok, extra="") => log.push(`${ok?"PASS":"FAIL"}  ${name}${extra!==undefined&&extra!==""?"  ("+extra+")":""}`);

const makeCard = (hass) => {
  const c = document.createElement("ems-home-card");
  document.body.appendChild(c);
  c.setConfig({ type:"custom:ems-home-card", title:"eMS Home" });
  c.hass = hass;
  return c;
};

customElements.whenDefined("ems-home-card").then(() => {
  // ---------- 1. discovery with the entity registry (real install) ----------
  const card = makeCard(makeHass());
  const e = card._entities;
  check("charge_mode resolves to the select, not the sensor",
        e.charge_mode === "select.ems_home_charge_mode", e.charge_mode);
  check("session energy found under the renamed device",
        e.session_energy === "sensor.controlroom_ems_home_ladeenergie", e.session_energy);
  check("grid power found", e.grid_power === "sensor.ems_home_grid_power", e.grid_power);
  check("pv quota found", e.pv_quota === "number.ems_home_min_pv_power_quota", e.pv_quota);

  // ---------- 2. clicking a mode reaches the select ----------
  calls.length = 0;
  card.shadowRoot.querySelector('button[data-mode="hybrid"]')
      .dispatchEvent(new MouseEvent("click", { bubbles:true, composed:true }));
  const call = calls[0] || {};
  check("click calls select.select_option", call.s === "select_option", JSON.stringify(call));
  check("click targets the select entity", call.p?.entity_id === "select.ems_home_charge_mode");
  check("click sends the chosen option", call.p?.option === "hybrid");

  // ---------- 3. no DOM rebuild on update, grid throttled ----------
  const gridNode = card.shadowRoot.querySelector('[data-bind="grid-value"]');
  const btnNode = card.shadowRoot.querySelector('button[data-mode="pv"]');
  card.hass = makeHass({ over: { "sensor.ems_home_ev_charging_power": S("7.100"),
                                 "sensor.ems_home_grid_power": S("9.999") } });
  check("mode button node survives an update",
        btnNode === card.shadowRoot.querySelector('button[data-mode="pv"]'));
  check("charging power updates immediately",
        card.shadowRoot.querySelector('[data-bind="car-value"]').textContent.trim() === "7,10",
        card.shadowRoot.querySelector('[data-bind="car-value"]').textContent);
  check("grid value throttled to 5 s", gridNode.textContent.trim() === "3,74", gridNode.textContent);

  // Vehicle labels update in place, preferring the current car over history.
  const carLabel = card.shadowRoot.querySelector('[data-bind="car-label"]');
  check("flow falls back to Auto without a vehicle", carLabel?.textContent === "Auto");
  const updateVehicle = attrs => {
    card.hass = makeHass({ over: {
      "sensor.controlroom_ems_home_ladeenergie": S("0", attrs),
    }});
  };
  updateVehicle({ vehicle: "SEAT Leon", last_vehicle: "Previous car" });
  check("flow uses current vehicle", carLabel?.textContent === "SEAT Leon");
  check("vehicle update preserves the flow label node",
        carLabel === card.shadowRoot.querySelector('[data-bind="car-label"]'));
  updateVehicle({ last_vehicle: "Previous car" });
  check("flow falls back to last_vehicle", carLabel?.textContent === "Previous car");
  updateVehicle({ vehicle: "   ", last_vehicle: "Last car" });
  check("blank vehicle falls back to last_vehicle", carLabel?.textContent === "Last car");
  const longName = "An exceptionally long vehicle name without breaking the flow layout";
  updateVehicle({ vehicle: longName });
  const labelStyle = getComputedStyle(carLabel);
  check("long vehicle name stays complete in the DOM", carLabel?.textContent === longName);
  check("long vehicle names use bounded two-line CSS",
        labelStyle.webkitLineClamp === "2" && labelStyle.overflow === "hidden" &&
        carLabel.clientHeight <= 26 && carLabel.clientWidth <= 116,
        `clamp=${labelStyle.webkitLineClamp}, overflow=${labelStyle.overflow}, size=${carLabel.clientWidth}x${carLabel.clientHeight}`);
  check("full vehicle name is available as a tooltip", carLabel.title === longName);
  updateVehicle({});
  check("flow returns to Auto when the name is removed", carLabel?.textContent === "Auto");

  // ---------- 4. fallback without registry ----------
  const bare = makeCard(makeHass({ withRegistry:false }));
  check("name fallback picks the select domain",
        bare._entities.charge_mode === "select.ems_home_charge_mode", bare._entities.charge_mode);

  // ---------- 4b. cost uses the grid/PV split ----------
  const pricey = makeCard(makeHass({ over:{
    "sensor.controlroom_ems_home_ladeenergie": S("10.0", {
      energy_from_grid_kwh: 4.0, energy_from_pv_kwh: 6.0 }) } }));
  pricey.setConfig({ type:"custom:ems-home-card", title:"eMS Home", price:0.30 });
  pricey.hass = makeHass({ over:{
    "sensor.controlroom_ems_home_ladeenergie": S("10.0", {
      energy_from_grid_kwh: 4.0, energy_from_pv_kwh: 6.0 }) } });
  const costText = pricey.shadowRoot.querySelector('[data-bind="cost"]').textContent.trim();
  check("cost prices grid energy only (4.0 kWh * 0,30)", costText === "1,20 €", costText);
  const splitText = pricey.shadowRoot.querySelector('[data-bind="split"]').textContent.trim();
  check("split line shows the split and what it would have cost",
        splitText === "4,0 kWh Netz · 6,0 kWh PV · statt 3,00 €", splitText);
  const savedText = pricey.shadowRoot.querySelector('[data-bind="saved"]').textContent.trim();
  check("savings shown (6.0 kWh * 0,30)", savedText === "· 1,80 € gespart", savedText);
  check("label is plain 'Kosten' (the amount is what was paid)",
        pricey.shadowRoot.querySelector('[data-bind="cost-label"]').textContent.trim() === "Kosten");

  const pvPrice = makeCard(makeHass({ over:{
    "sensor.controlroom_ems_home_ladeenergie": S("10.0", {
      energy_from_grid_kwh: 4.0, energy_from_pv_kwh: 6.0 }) } }));
  pvPrice.setConfig({ type:"custom:ems-home-card", title:"eMS Home", price:0.30, pv_price:0.10 });
  const pvCost = pvPrice.shadowRoot.querySelector('[data-bind="cost"]').textContent.trim();
  check("pv_price is added (4*0,30 + 6*0,10)", pvCost === "1,80 €", pvCost);

  // ---------- 4c. finished but still plugged in ----------
  const endedAt = new Date(Date.now() - 12 * 60000).toISOString();
  const ended = makeCard(makeHass({ over:{
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.ems_home_ev_charging_state": S("idle", {}, endedAt),
    "sensor.ems_home_wallbox_status": S("finished"),
    "sensor.controlroom_ems_home_ladeenergie": S("12.4", {
      energy_from_grid_kwh: 5.1, energy_from_pv_kwh: 7.3 }),
  }}));
  ended.setConfig({ type:"custom:ems-home-card", title:"eMS Home", price:0.30 });
  ended.hass = makeHass({ over:{
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.ems_home_ev_charging_state": S("idle", {}, endedAt),
    "sensor.ems_home_wallbox_status": S("finished"),
    "sensor.controlroom_ems_home_ladeenergie": S("12.4", {
      energy_from_grid_kwh: 5.1, energy_from_pv_kwh: 7.3 }),
  }});
  check("finished shows the summary banner", !!ended.shadowRoot.querySelector(".ended"));
  check("finished hides the flow", !ended.shadowRoot.querySelector(".flow"));
  check("finished keeps energy + duration",
        ended.shadowRoot.querySelectorAll(".stats .tile").length === 2,
        ended.shadowRoot.querySelectorAll(".stats .tile").length);
  check("finished drops the power tiles",
        !ended.shadowRoot.querySelector('[data-bind="tile-power"]') &&
        !ended.shadowRoot.querySelector('[data-bind="tile-grid"]'));
  check("finished shows the result block", !!ended.shadowRoot.querySelector(".result"));
  const resCost = ended.shadowRoot.querySelector('[data-bind="res-cost"]').textContent.trim();
  check("result cost = grid share * price (5.1 * 0,30)", resCost === "1,53 €", resCost);
  const resSaved = ended.shadowRoot.querySelector('[data-bind="res-saved"]').textContent.trim();
  check("result shows the saving (7.3 * 0,30)", resSaved === "2,19 € gespart", resSaved);
  const resSplit = ended.shadowRoot.querySelector('[data-bind="res-split"]').textContent.trim();
  check("result split line", resSplit === "5,1 kWh Netz · 7,3 kWh PV · 0,30 €/kWh", resSplit);
  check("status label says finished",
        ended.shadowRoot.querySelector('[data-bind="sub"]').textContent.trim().startsWith("Ladevorgang beendet"),
        ended.shadowRoot.querySelector('[data-bind="sub"]').textContent.trim());
  const endedText = ended.shadowRoot.querySelector('[data-bind="ended"]').textContent.trim();
  check("banner shows a clock time, not minutes ago",
        /· (heute|gestern) um \d\d:\d\d$/.test(endedText) || /· \d\d\.\d\d\. um \d\d:\d\d$/.test(endedText),
        endedText);

  // car gone, but there IS a finished session to report
  const gone = makeCard(makeHass({ over:{
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.ems_home_ev_charging_state": S("idle"),
    "sensor.ems_home_wallbox_status": S("available"),
    "sensor.controlroom_ems_home_ladeenergie": S("12.4", {
      energy_from_grid_kwh: 5.1, energy_from_pv_kwh: 7.3,
      last_ended_at: new Date(Date.now() - 35*60000).toISOString() }),
  }}));
  gone.setConfig({ type:"custom:ems-home-card", title:"eMS Home", price:0.30 });
  check("car gone with a session shows the summary", !!gone.shadowRoot.querySelector(".ended"));
  check("banner says 'Letzter Ladevorgang'",
        gone.shadowRoot.querySelector(".ended-body b").textContent.trim() === "Letzter Ladevorgang");
  check("no flow in the summary", !gone.shadowRoot.querySelector(".flow"));

  // a configured vehicle sensor names the car; without one the line stays plain
  const withVehicle = makeCard(makeHass({ over: {
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.controlroom_ems_home_ladeenergie": S("12.4", {
      energy_from_grid_kwh: 5.1, energy_from_pv_kwh: 7.3,
      vehicle: "SEAT Leon", last_vehicle: "SEAT Leon" }) } }));
  withVehicle.setConfig({ type: "custom:ems-home-card", title: "eMS Home", price: 0.35 });
  const namedBanner = withVehicle.shadowRoot.querySelector('[data-bind="ended-title"]');
  check("banner names the car", namedBanner && namedBanner.textContent.includes("SEAT Leon"),
        namedBanner ? namedBanner.textContent : "missing");
  check("no vehicle, no dangling separator",
        gone.shadowRoot.querySelector('[data-bind="ended-title"]').textContent.trim() === "Letzter Ladevorgang");

  // a stored cost wins over a recalculation when the card sets no price
  const stored = makeCard(makeHass({ over: {
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.controlroom_ems_home_ladeenergie": S("8.712", {
      energy_from_grid_kwh: 6.13, energy_from_pv_kwh: 2.582,
      cost: 2.145, saved: 0.903, price_per_kwh: 0.35 }) } }));
  stored.setConfig({ type: "custom:ems-home-card", title: "eMS Home" });
  const storedCost = stored.shadowRoot.querySelector('[data-bind="res-cost"]').textContent.trim();
  check("the integration's cost is used verbatim", storedCost === "2,15 €", storedCost);
  check("result block present", !!gone.shadowRoot.querySelector(".result"));

  // nothing to report at all
  const empty = makeCard(makeHass({ over:{
    "sensor.ems_home_ev_charging_power": S("0"),
    "sensor.ems_home_ev_charging_state": S("idle"),
    "sensor.ems_home_wallbox_status": S("available"),
    "sensor.controlroom_ems_home_ladeenergie": S("0"),
    "sensor.ems_home_charging_session_duration": S("0"),
  }}));
  check("no banner without any session", !empty.shadowRoot.querySelector(".ended"));
  check("live layout when there is nothing to report", !!empty.shadowRoot.querySelector(".flow"));

  // ---------- 4d. default tariff and languages ----------
  const noPrice = makeCard(makeHass({ over:{
    "sensor.controlroom_ems_home_ladeenergie": S("12.4") } }));
  const unit = noPrice.shadowRoot.querySelector('[data-bind="unit-price"]');
  check("default tariff is 0,35 €/kWh", unit && unit.textContent.trim() === "0,35", unit && unit.textContent);
  const defCost = noPrice.shadowRoot.querySelector('[data-bind="cost"]').textContent.trim();
  check("cost uses the default tariff (12.4 kWh * 0,35)", defCost === "4,34 €", defCost);

  const withPrice = makeCard(makeHass({ over:{
    "sensor.controlroom_ems_home_ladeenergie": S("10.0", { price_per_kwh: 0.42 }) } }));
  withPrice.setConfig({ type:"custom:ems-home-card", title:"eMS Home" });
  const attrUnit = withPrice.shadowRoot.querySelector('[data-bind="unit-price"]');
  check("integration tariff is used when the card sets none",
        attrUnit && attrUnit.textContent.trim() === "0,42", attrUnit && attrUnit.textContent);

  const english = makeCard(makeHass({ lang: "en-GB" }));
  check("english flow falls back to Car",
        english.shadowRoot.querySelector('[data-bind="car-label"]')?.textContent === "Car");
  const enLabels = [...english.shadowRoot.querySelectorAll(".tile-label")].map(n => n.textContent.trim());
  check("english labels", enLabels.includes("CHARGING POWER") || enLabels.includes("Charging power"),
        enLabels.join(" | "));
  const enSub = english.shadowRoot.querySelector('[data-bind="sub"]').textContent.trim();
  check("english status", enSub.startsWith("Charging"), enSub);
  const enModes = [...english.shadowRoot.querySelectorAll("button[data-mode]")]
    .map(b => b.textContent.trim().toLowerCase());
  check("english mode labels", enModes.includes("locked") && enModes.includes("grid"), enModes.join(" | "));

  // ---------- 4e. 0,11 kW is not charging ----------
  const blip = makeCard(makeHass({ over:{
    "sensor.ems_home_ev_charging_power": S("0.11"),
    "sensor.controlroom_ems_home_ladeenergie": S("12.4", {
      energy_from_grid_kwh: 5.1, energy_from_pv_kwh: 7.3, noise_floor_kw: 0.35 }),
  }}));
  check("a 0,11 kW blip is not 'charging'",
        !blip.shadowRoot.querySelector('[data-bind="status"]').classList.contains("on"));
  const blipStatus = blip.shadowRoot.querySelector('[data-bind="sub"]').textContent.trim();
  check("status no longer says 'Lädt'", !blipStatus.startsWith("Lädt"), blipStatus);
  check("the car stream is not animating", !blip.shadowRoot.querySelector('[data-bind="stream-car"]'));

  // ---------- 5. locked / pv ----------
  const locked = makeCard(makeHass({ over:{ "select.ems_home_charge_mode": S("lock"),
                                            "sensor.ems_home_charge_mode": S("lock") } }));
  check("locked hides flow", !locked.shadowRoot.querySelector(".flow"));
  check("locked hides stats", !locked.shadowRoot.querySelector(".stats"));
  check("locked keeps the buttons", !!locked.shadowRoot.querySelector('button[data-mode="grid"]'));

  const pv = makeCard(makeHass({ over:{ "select.ems_home_charge_mode": S("pv"),
                                        "sensor.ems_home_charge_mode": S("pv") } }));
  const labels = [...pv.shadowRoot.querySelectorAll(".node .label")].map(n => n.textContent.trim());
  check("pv source label is 'PV' (no grid in pv mode)", labels[0] === "PV", labels.join(" | "));
  check("pv has no quota slider", !pv.shadowRoot.querySelector("#quota"));
  const hybridLabels = [...makeCard(makeHass({ over:{
    "select.ems_home_charge_mode": S("hybrid"), "sensor.ems_home_charge_mode": S("hybrid") } }))
    .shadowRoot.querySelectorAll(".node .label")].map(n => n.textContent.trim());
  check("hybrid source label is 'PV + Netz'", hybridLabels[0] === "PV + Netz", hybridLabels.join(" | "));
  const gridLabels = [...makeCard(makeHass({ over:{
    "select.ems_home_charge_mode": S("grid"), "sensor.ems_home_charge_mode": S("grid") } }))
    .shadowRoot.querySelectorAll(".node .label")].map(n => n.textContent.trim());
  check("grid source label is 'Netz'", gridLabels[0] === "Netz", gridLabels.join(" | "));

  check("hybrid has the quota slider", !!makeCard(makeHass({ over:{
    "select.ems_home_charge_mode": S("hybrid"), "sensor.ems_home_charge_mode": S("hybrid") } }))
    .shadowRoot.querySelector("#quota"));

  // ---------- late states: the card is built before hass has states ----------
  const late = document.createElement("ems-home-card");
  document.body.appendChild(late);
  late.setConfig({ type:"custom:ems-home-card", title:"eMS Home" });
  late.hass = { states:{}, entities:{}, locale:{ language:"de-DE" } };
  late.hass = makeHass();
  const lateTexts = [...late.shadowRoot.querySelectorAll('[data-bind]')]
    .map((n) => n.textContent.trim()).join(" ");
  check("card recovers when the states arrive after the first render",
        !late._entitiesIncomplete() && /[1-9]/.test(lateTexts), lateTexts.slice(0, 80));

  // ---------- power unavailable must not mean "charge finished" ----------
  const outage = makeCard(makeHass());        // charging, so the face is "charging"
  outage.hass = makeHass({ over:{ "sensor.ems_home_ev_charging_power": S("unavailable") } });
  check("unavailable power keeps the charging face",
        outage._phase("grid") === "charging", String(outage._phase("grid")));

  // ---------- a cancelled drag must not freeze the quota slider ----------
  const slider = makeCard(makeHass({ over:{
    "select.ems_home_charge_mode": S("hybrid"), "sensor.ems_home_charge_mode": S("hybrid") } }));
  const range = slider.shadowRoot.querySelector("#quota");
  if (range) {
    range.dispatchEvent(new Event("pointerdown"));
    range.dispatchEvent(new Event("pointercancel"));
    check("pointercancel ends the drag", slider._dragging === false);
  }

  // ---------- a missing power value must not read as "charge finished" ----------
  try {
    const gone = makeCard(makeHass());
    gone.hass = makeHass({ over:{ "sensor.ems_home_ev_charging_power": S("unavailable") } });
    const carNode = gone.shadowRoot.querySelector('[data-bind="car-value"]');
    const hubNode = gone.shadowRoot.querySelector('[data-bind="hub-status"]');
    const carValue = carNode ? carNode.textContent.trim() : "(kein Knoten)";
    const hubStatus = hubNode ? hubNode.textContent.trim() : "(kein Knoten)";
    check("missing power shows a dash instead of 0,00", carValue === "–", carValue);
    check("missing power keeps the charging status", /Lädt|lädt|charging|Charg/i.test(hubStatus), hubStatus);
    gone.hass = makeHass({ over:{ "sensor.ems_home_ev_charging_power": S("unavailable") }, lang:"en-GB" });
    gone._render();
    check("a rebuild keeps the face while power is missing",
          gone._phase("grid") === "charging", String(gone._phase("grid")));
  } catch (err) {
    check("card outage checks run", false, String(err));
  }

  // Review regressions: all fixtures/services are local, no HA connection.
  const text = (c, bind) => c.shadowRoot.querySelector(`[data-bind="${bind}"]`)?.textContent.trim();
  const review = (id, run) => { try { run(); } catch (err) { check(id + " executes", false, String(err)); } };
  const hybridHass = quota => makeHass({ over: {
    "select.ems_home_charge_mode": S("hybrid"),
    "number.ems_home_min_pv_power_quota": S(quota, {step:10}),
  }});

  review("M1", () => {
    const h = makeHass();
    Object.values(h.entities).forEach(entry => { entry.device_id = "A"; });
    // B's select is first, A's grid/power are first. Per-role first-match mixes them.
    const bSelect = {entity_id:"select.second_mode", platform:"ems_home", device_id:"B",
                     unique_id:"B_charge_mode_select", translation_key:"charge_mode"};
    h.entities = { [bSelect.entity_id]:bSelect, ...h.entities };
    h.states[bSelect.entity_id] = S("pv");
    const c = makeCard(h);
    calls.length = 0;
    c._setMode("hybrid");
    check("M1 auto-discovery keeps display and select on device A",
          c._entities.grid_power === "sensor.ems_home_grid_power" &&
          calls[0]?.p.entity_id === "select.ems_home_charge_mode", JSON.stringify(c._entities));
    c.setConfig({entities:{grid_power:"sensor.ems_home_grid_power", charge_mode:bSelect.entity_id}});
    check("M1 explicit cross-device entities remain an intentional override",
          c._entities.charge_mode === bSelect.entity_id && c._entities.grid_power === "sensor.ems_home_grid_power");
    c.setConfig({entities:{charge_mode:bSelect.entity_id}});
    check("M1 partial explicit device B never fills its missing grid with A",
          !c._entities.grid_power, String(c._entities.grid_power));
    // Same case without unique_id, as supplied by recent HA frontend registries.
    const keyH = makeHass();
    Object.values(keyH.entities).forEach(entry => { entry.device_id="A"; });
    keyH.entities["sensor.ems_home_grid_power"].translation_key="grid_power";
    keyH.entities["sensor.ems_home_grid_power"].unique_id=undefined;
    keyH.entities["select.ems_home_charge_mode"].translation_key="charge_mode";
    keyH.entities["select.ems_home_charge_mode"].unique_id=undefined;
    keyH.entities = {[bSelect.entity_id]:{...bSelect, unique_id:undefined}, ...keyH.entities};
    keyH.states[bSelect.entity_id] = S("pv");
    const keyC = makeCard(keyH);
    check("M1 translation-key discovery also stays on device A",
          keyC._entities.charge_mode === "select.ems_home_charge_mode", keyC._entities.charge_mode);
    h.entities["sensor.roof_power"] = {entity_id:"sensor.roof_power", platform:"inverter", device_id:"roof"};
    h.states["sensor.roof_power"] = S("4");
    const external = makeCard(h);
    external.setConfig({entities:{pv_power:"sensor.roof_power"}});
    check("M1 external PV source does not select the EMS device",
          external._entities.grid_power === "sensor.ems_home_grid_power" && external._entities.charge_mode === "select.ems_home_charge_mode",
          JSON.stringify(external._entities));
    const manual = makeCard(makeHass({withRegistry:false}));
    manual.setConfig({entities:{charge_mode:"select.manual_b", grid_power:"sensor.manual_a"}});
    check("M1 registry-free explicit mapping is preserved", manual._entities.charge_mode === "select.manual_b" && manual._entities.grid_power === "sensor.manual_a");
  });

  review("M2", () => {
    for (const layout of ["full", "compact"]) {
      for (const state of ["unavailable", "unknown", "missing"]) {
        const h = makeHass();
        for (const id of Object.keys(h.states)) {
          if (id.startsWith("sensor.")) h.states[id] = S(state);
        }
        // Explicit IDs ensure a missing entity is still the configured source.
        if (state === "missing") for (const id of Object.keys(h.states)) {
          if (id.startsWith("sensor.")) delete h.states[id];
        }
        const c = makeCard(h);
        c.setConfig({layout, entities:{grid_power:"sensor.ems_home_grid_power",
          ev_power:"sensor.ems_home_ev_charging_power", session_energy:"sensor.controlroom_ems_home_ladeenergie",
          session_duration:"sensor.ems_home_charging_session_duration"}});
        const binds = layout === "full" ? ["tile-grid", "tile-power", "tile-energy", "tile-duration"] : ["hero-value", "g1-value", "g2-value", "g3-value"];
        const values = binds.map(bind => text(c, bind)).filter(v => v !== undefined && v !== "");
        check(`M2 ${layout} ${state} values are dashes`, values.length > 0 && values.every(v => v.startsWith("–")), JSON.stringify(values));
        check(`M2 ${layout} ${state} cost is not a fabricated zero`,
              text(c, "cost") === "–", String(text(c, "cost")));
      }
    }
    const zero = makeCard(makeHass({over:{
      "sensor.ems_home_ev_charging_power":S("0"), "sensor.ems_home_grid_power":S("0"),
      "sensor.controlroom_ems_home_ladeenergie":S("0"), "sensor.ems_home_charging_session_duration":S("0"),
    }}));
    check("M2 real zero remains zero", text(zero,"tile-grid") === "0,00" && text(zero,"cost") === "0,00 €");
    const storedUnknown = makeCard(makeHass({over:{
      "sensor.controlroom_ems_home_ladeenergie":S("unavailable", {cost:2.5, saved:0.2}),
    }}));
    check("M2 known stored cost survives unavailable total", text(storedUnknown,"cost") === "2,50 €", text(storedUnknown,"cost"));
    const nullSplit = makeCard(makeHass({over:{
      "sensor.controlroom_ems_home_ladeenergie":S("unavailable", {energy_from_grid_kwh:null, energy_from_pv_kwh:null}),
    }}));
    check("M2 null split is not converted to zero cost", text(nullSplit,"cost") === "–", text(nullSplit,"cost"));
    check("M2 missing grid keeps a finite animation duration", nullSplit._streamDuration(NaN) === "3.20", nullSplit._streamDuration(NaN));
  });

  review("M3", () => {
    for (const state of ["unavailable", "unknown", "missing"]) {
      const h = makeHass({over:{"sensor.ems_home_ev_charging_power":S(state)}});
      if (state === "missing") delete h.states["sensor.ems_home_ev_charging_power"];
      const c = makeCard(h);
      check(`M3 cold ${state} with duration is not a finished session`,
            !c.shadowRoot.querySelector(".ended") && !c._isSummary(c._phase("grid")), c._phase("grid"));
    }
    for (const last of [null, "", 0]) {
      const c = makeCard(makeHass({over:{
        "sensor.ems_home_ev_charging_power":S("0"),
        "sensor.ems_home_charging_session_duration":S("0"),
        "sensor.controlroom_ems_home_ladeenergie":S("0",{last_energy_kwh:last}),
      }}));
      check(`M3 last_energy_kwh=${JSON.stringify(last)} alone is not a session`, !c._hasSession(), c._phase("grid"));
    }
    const c = makeCard(makeHass());
    const h = makeHass(); delete h.states["sensor.ems_home_ev_charging_power"];
    c.hass = h;
    check("M3 missing power preserves previously observed charging", c._phase("grid") === "charging", c._phase("grid"));
    const tiny = makeCard(makeHass({over:{
      "sensor.ems_home_ev_charging_power":S("0"), "sensor.ems_home_charging_session_duration":S("0"),
      "sensor.controlroom_ems_home_ladeenergie":S("0",{last_energy_kwh:0.01}),
    }}));
    check("M3 positive historic energy remains a session", tiny._hasSession());
  });

  review("M6", () => {
    const c = makeCard(hybridHass("90"));
    c.shadowRoot.querySelector("#quota").dispatchEvent(new Event("pointerdown"));
    c.setConfig({title:"rebuilt"});
    c.hass = hybridHass("40");
    check("M6 setConfig during drag allows next external quota", !c._dragging && c.shadowRoot.querySelector("#quota")?.value === "40", `dragging=${c._dragging}, value=${c.shadowRoot.querySelector("#quota")?.value}`);
    c.shadowRoot.querySelector("#quota").dispatchEvent(new Event("pointerdown"));
    c.remove(); document.body.appendChild(c);
    c.hass = hybridHass("60");
    check("M6 detach/reattach during drag allows next quota", !c._dragging && c.shadowRoot.querySelector("#quota")?.value === "60", `dragging=${c._dragging}, value=${c.shadowRoot.querySelector("#quota")?.value}`);
    c.shadowRoot.querySelector("#quota").dispatchEvent(new Event("pointerdown"));
    c.hass = {...hybridHass("70"), locale:{language:"en-GB"}};
    check("M6 structural rebuild also cancels drag", !c._dragging && c.shadowRoot.querySelector("#quota")?.value === "70", `dragging=${c._dragging}`);
  });

  // Deterministic timers: trigger precisely the card's 20s callback, not wall time.
  review("M7/N3", () => {
    const nativeSet = window.setTimeout, nativeClear = window.clearTimeout;
    const timers = new Map(); let serial = 100000;
    window.setTimeout = (fn, ms) => { const id = ++serial; timers.set(id, {fn,ms}); return id; };
    window.clearTimeout = id => { if (!timers.delete(id)) nativeClear(id); };
    try {
      const c = makeCard(makeHass());
      c._setMode("pv");
      const timer = timers.get(c._modeTimer); timers.delete(c._modeTimer); timer.fn();
      const pill = c.shadowRoot.querySelector(".pill")?.textContent;
      check("M7 unconfirmed mode rolls pill and selected button back after 20s",
            pill === "Netz" && c.shadowRoot.querySelector('button[data-mode="grid"]')?.classList.contains("sel"), String(pill));
      const confirmed = makeCard(makeHass()); confirmed._setMode("hybrid");
      const confirmedTimer = timers.get(confirmed._modeTimer);
      confirmed.hass = hybridHass("50");
      const confirmedNode = confirmed.shadowRoot.querySelector("#quota");
      confirmedTimer.fn();
      check("M7 confirmed mode timeout does not rebuild controls", confirmedNode === confirmed.shadowRoot.querySelector("#quota"));
      const coldUnknown = makeCard(hybridHass("unknown"));
      check("M7 cold unknown does not expose quota slider", !coldUnknown.shadowRoot.querySelector("#quota"));
      const becomesUnavailable = makeCard(hybridHass("80"));
      becomesUnavailable.hass = hybridHass("unavailable");
      check("M7 valid quota becoming unavailable removes slider", !becomesUnavailable.shadowRoot.querySelector("#quota"));
      const quota = makeCard(hybridHass("unavailable"));
      quota.hass = hybridHass("50");
      check("M7 quota slider returns after unavailable", quota.shadowRoot.querySelector("#quota")?.value === "50", String(quota.shadowRoot.querySelector("#quota")?.value));
      quota.hass = hybridHass("unavailable");
      check("M7 unavailable removes quota slider", !quota.shadowRoot.querySelector("#quota"));
      quota.hass = hybridHass("unknown");
      check("M7 unknown does not expose quota slider", !quota.shadowRoot.querySelector("#quota"));
      quota.hass = hybridHass("30");
      check("M7 quota slider returns after unknown", quota.shadowRoot.querySelector("#quota")?.value === "30");
      const detached = makeCard(makeHass()); detached._setMode("pv");
      const modeTimer = detached._modeTimer;
      detached.remove();
      check("N3 detach clears mode timeout", !timers.has(modeTimer), `timerAlive=${timers.has(modeTimer)}`);
      check("N3 detach drops stale optimistic mode", !detached._pendingMode, String(detached._pendingMode));
      document.body.appendChild(detached); detached.hass = makeHass();
      check("N3 reattached card shows observed mode", detached.shadowRoot.querySelector(".pill")?.textContent === "Netz", detached.shadowRoot.querySelector(".pill")?.textContent);
    } finally { window.setTimeout = nativeSet; window.clearTimeout = nativeClear; }
  });

  review("N4", () => {
    const h = makeHass({over:{"sensor.controlroom_ems_home_ladeenergie":S("10", {
      energy_from_grid_kwh:4, energy_from_pv_kwh:6, cost:1.4, saved:2.1, price_per_kwh:0.35,
    })}});
    const c = makeCard(h);
    c.setConfig({pv_price:0.10});
    check("N4 pv_price-only override recalculates cost", text(c,"cost") === "2,00 €", text(c,"cost"));
    check("N4 pv_price-only override recalculates savings", text(c,"saved") === "· 1,50 € gespart", text(c,"saved"));
    c.setConfig({pv_price:0});
    check("N4 explicit zero PV price is also an override", text(c,"cost") === "1,40 €", text(c,"cost"));
    c.setConfig({});
    check("N4 absent overrides preserve historical cost", text(c,"cost") === "1,40 €", text(c,"cost"));
    const unstored = makeCard(makeHass({over:{"sensor.controlroom_ems_home_ladeenergie":S("10", {
      energy_from_grid_kwh:4, energy_from_pv_kwh:6, price_per_kwh:0.35,
    })}}));
    unstored.setConfig({pv_price:0.10});
    check("N4 pv_price-only already works without stored cost", text(unstored,"cost") === "2,00 €", text(unstored,"cost"));
    const paidPv = makeCard(makeHass({over:{"sensor.controlroom_ems_home_ladeenergie":S("10", {
      energy_from_grid_kwh:4, energy_from_pv_kwh:6, cost:2, saved:1.5,
      price_per_kwh:0.35, pv_price_per_kwh:0.10,
    })}}));
    paidPv.setConfig({pv_price:0});
    check("N4 explicit zero overrides a stored positive PV tariff", text(paidPv,"cost") === "1,40 €", text(paidPv,"cost"));
    const summary = makeCard(makeHass({over:{
      "sensor.ems_home_ev_charging_power":S("0"),
      "sensor.controlroom_ems_home_ladeenergie":h.states["sensor.controlroom_ems_home_ladeenergie"],
    }}));
    summary.setConfig({pv_price:0.10});
    check("N4 pv_price-only override also recalculates summary", text(summary,"res-cost") === "2,00 €", text(summary,"res-cost"));
  });

  document.getElementById("out").textContent = log.join("\n");
  document.title = log.every(l => l.startsWith("PASS")) ? "ALL PASS" : "FAILURES";
});
</script>
<script type="module" src="../custom_components/ems_home/frontend/ems-home-card.js"></script>
</body></html>
