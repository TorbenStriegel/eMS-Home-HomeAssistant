<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>eMS Home · automatic charge preview</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 26px; display: flex; flex-direction: column; gap: 20px;
    font-family: "Roboto", -apple-system, "Segoe UI", sans-serif; background: #0b0e13;
  }
  .row { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .cell { width: 420px; }
  .narrow { width: 390px; }
  .caption { color: #7b8794; font-size: 12px; margin: 6px 0 0 4px; letter-spacing: .4px; text-transform: uppercase; }
  .dark {
    --primary-text-color: #e8eef5;
    --secondary-text-color: #94a3b8;
    --divider-color: rgba(255,255,255,.09);
    --card-background-color: #161a21;
    --ha-card-background: #161a21;
    --ha-card-border-color: rgba(255,255,255,.07);
    --ha-card-border-radius: 20px;
    --disabled-text-color: #5b6472;
    --accent: #4f9cf9;
    --success-color: #3fb950;
    --error-color: #f85149;
    padding: 1px;
  }
  .light {
    color: #14181d;
    --primary-text-color: #14181d;
    --secondary-text-color: #5b6672;
    --divider-color: rgba(0,0,0,.10);
    --card-background-color: #ffffff;
    --ha-card-background: #ffffff;
    --ha-card-border-color: rgba(0,0,0,.08);
    --ha-card-border-radius: 20px;
    --accent: #1d6fd8;
    --success-color: #1a7f37;
    --error-color: #cf222e;
    background: #eef1f5; border-radius: 22px; padding: 14px;
  }
  /* HA's default light theme: only --card-background-color, no --ha-card-background */
  .halight {
    color: #212121;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --divider-color: rgba(0,0,0,.12);
    --card-background-color: #ffffff;
    --primary-color: #03a9f4;
    background: #fafafa; border-radius: 22px; padding: 14px;
  }
</style>
</head>
<body>

<div class="row">
  <div class="cell"><div class="dark"><ems-home-card id="closed"></ems-home-card></div>
    <div class="caption">Scharf · wartet auf Überschuss (geschlossen)</div></div>
  <div class="cell"><div class="dark"><ems-home-card id="open"></ems-home-card></div>
    <div class="caption">Schwellen aufgeklappt</div></div>
</div>

<div class="row">
  <div class="cell"><div class="dark"><ems-home-card id="charging"></ems-home-card></div>
    <div class="caption">Lädt · automatisch freigegeben</div></div>
  <div class="cell light"><ems-home-card id="light"></ems-home-card>
    <div class="caption" style="color:#7b8794">Hell · nicht scharf</div></div>
</div>

<div class="row">
  <div class="narrow"><div class="dark"><ems-home-card id="compact"></ems-home-card></div>
    <div class="caption">Kompakt bei 390 px</div></div>
</div>

<script>
const S = (state, attrs = {}) => ({ entity_id: "", state: String(state), attributes: attrs,
  last_changed: new Date().toISOString() });
const EID = "01JABCDEF_";
const calls = [];

const hass = ({armed = true, stateName = "waiting_surplus", soc = 96, surplus = 3680,
               deficit = 320, mode = "hybrid", released = false, power = null} = {}) => {
  const states = {
    "sensor.ems_home_grid_power": S("3.744"),
    "sensor.ems_home_ev_charging_power": S(power ?? (stateName === "charging" ? "4.10" : "0")),
    "sensor.ems_home_ev_charging_state": S(stateName === "charging" || power ? "charging" : "idle"),
    "select.ems_home_charge_mode": S(armed ? "lock" : mode, { options: ["lock", "grid", "pv", "hybrid"] }),
    "number.ems_home_min_pv_power_quota": S("90", { min: 0, max: 100, step: 10 }),
    "sensor.ems_home_charging_session_duration": S("0"),
    "switch.ems_home_auto_charge_armed": S(armed ? "on" : "off"),
    "sensor.ems_home_auto_charge_state": S(stateName, {
      armed, released, run_id: "ab12cd34", reason_code: "surplus_too_low",
      target_mode: "hybrid", surplus_w: surplus, surplus_deficit_w: deficit, soc,
      confirmed_mode: armed ? "lock" : mode,
      settings: {surplus_start_w: 4000, surplus_hold_s: 120, soc_full_pct: 99,
                 soc_min_pct: 90, target_mode: "hybrid", no_vehicle: "wait"},
    }),
    "number.ems_home_auto_surplus_start": S("4000", { min: 200, max: 30000, step: 100 }),
    "number.ems_home_auto_surplus_hold": S("60", { min: 0, max: 3600, step: 10 }),
    "number.ems_home_auto_soc_full": S("99", { min: 20, max: 99, step: 1 }),
    "number.ems_home_auto_soc_min": S("90", { min: 0, max: 95, step: 1 }),
    "select.ems_home_auto_target_mode": S("hybrid", { options: ["pv", "hybrid"] }),
    "select.ems_home_auto_no_vehicle": S("wait", { options: ["wait", "allow_release"] }),
  };
  for (const [id, entry] of Object.entries(states)) entry.entity_id = id;
  const entities = {
    "select.ems_home_charge_mode": { entity_id: "select.ems_home_charge_mode", platform: "ems_home", unique_id: EID + "charge_mode_select" },
    "number.ems_home_min_pv_power_quota": { entity_id: "number.ems_home_min_pv_power_quota", platform: "ems_home", unique_id: EID + "pv_quota_number" },
    "switch.ems_home_auto_charge_armed": { entity_id: "switch.ems_home_auto_charge_armed", platform: "ems_home", unique_id: EID + "auto_charge_armed" },
    "sensor.ems_home_auto_charge_state": { entity_id: "sensor.ems_home_auto_charge_state", platform: "ems_home", unique_id: EID + "auto_charge_state" },
    "number.ems_home_auto_surplus_start": { entity_id: "number.ems_home_auto_surplus_start", platform: "ems_home", unique_id: EID + "auto_surplus_start" },
    "number.ems_home_auto_surplus_hold": { entity_id: "number.ems_home_auto_surplus_hold", platform: "ems_home", unique_id: EID + "auto_surplus_hold" },
    "number.ems_home_auto_soc_full": { entity_id: "number.ems_home_auto_soc_full", platform: "ems_home", unique_id: EID + "auto_soc_full" },
    "number.ems_home_auto_soc_min": { entity_id: "number.ems_home_auto_soc_min", platform: "ems_home", unique_id: EID + "auto_soc_min" },
    "select.ems_home_auto_target_mode": { entity_id: "select.ems_home_auto_target_mode", platform: "ems_home", unique_id: EID + "auto_target_mode" },
    "select.ems_home_auto_no_vehicle": { entity_id: "select.ems_home_auto_no_vehicle", platform: "ems_home", unique_id: EID + "auto_no_vehicle" },
  };
  const lang = new URLSearchParams(location.search).get("lang") || "de-DE";
  return { states, entities, locale: { language: lang }, language: lang.slice(0, 2),
           callService: (d, s, p) => calls.push({ d, s, p }) };
};

const setup = (id, options, config = {}) => {
  const card = document.getElementById(id);
  card.setConfig({ type: "custom:ems-home-card", title: "Ladeverlauf", ...config });
  card.hass = hass(options);
  return card;
};

customElements.whenDefined("ems-home-card").then(() => {
  const only = new URLSearchParams(location.search).get("only");
  if (only) {
    // One card, no captions, for documentation shots.
    document.body.innerHTML = "";
    const variants = {
      closed: {},
      open: {},  // same as closed: there is no settings panel any more
      charging: { armed: false, stateName: "charging", released: true, mode: "hybrid" },
      light: { armed: false, stateName: "off", mode: "hybrid" },
      compact: {},
    };
    const wrap = document.createElement("div");
    wrap.className = only === "light" ? "light" : only === "halight" ? "halight" : "dark";
    const widthParam = new URLSearchParams(location.search).get("width");
    wrap.style.width = widthParam
      ? `${Number(widthParam)}px`
      : only === "compact" ? "390px" : "420px";
    wrap.style.margin = "0";
    const card = document.createElement("ems-home-card");
    card.id = only;
    wrap.appendChild(card);
    document.body.appendChild(wrap);
    card.setConfig({
      type: "custom:ems-home-card",
      title: "Ladeverlauf",
      ...(only === "compact" ? { layout: "compact" } : {}),
    });
    const params = new URLSearchParams(location.search);
    const variant = { ...(variants[only] || {}) };
    if (params.get("state")) variant.stateName = params.get("state");
    if (params.get("armed")) variant.armed = params.get("armed") === "1";
    variant.released = ["starting", "released", "charging"].includes(variant.stateName);
    // ?power=4.1 a charge runs; ?confirm=1 shows the second-tap warning (U1)
    if (params.get("power")) variant.power = params.get("power");
    if (params.get("confirm") === "1") card._autoConfirmUntil = Date.now() + 60_000;
    card.hass = hass(variant);
    return;
  }

  setup("closed", {});
  const open = setup("open", {});
  setup("charging", { armed: false, stateName: "charging", released: true, mode: "hybrid" });
  setup("light", { armed: false, stateName: "off", mode: "hybrid" });
  setup("compact", {}, { layout: "compact" });
  void open;
});
</script>
<script type="module" src="../custom_components/ems_home/frontend/ems-home-card.js"></script>
</body>
</html>
