<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>eMS Home – Karte mit Verlauf</title>
<!--
  The main card and the window behind its "Verlauf" button, with mocked data.
  Query:
    history=<url-encoded JSON>   the card's history: block, e.g. {"period":"week","metric":"cost"}
    show_history=0               hide the button
    layout=compact               compact card
    open=1                       open the window right away
    theme=light | halight | dark (halight = HA default light: no --ha-card-background)
    lang=en-US                   English
    w=390                        card width in px (default 420)
    editor=1                     list the editor fields with their labels and defaults
-->
<style>
  body { margin: 0; padding: 16px; background: #0b0e13; font-family: "Roboto", -apple-system, "Segoe UI", sans-serif; }
  .dark {
    --primary-text-color: #e8eef5; --secondary-text-color: #94a3b8; --divider-color: rgba(255,255,255,.09);
    --card-background-color: #161a21; --ha-card-background: #161a21; --ha-card-border-radius: 20px;
    --primary-color: #4f9cf9; --accent-color: #4f9cf9; --success-color: #3fb950; --error-color: #f85149;
    --secondary-background-color: #24272e; color: #e8eef5;
  }
  .light {
    --primary-text-color: #14181d; --secondary-text-color: #5b6672; --divider-color: rgba(0,0,0,.10);
    --card-background-color: #ffffff; --ha-card-background: #ffffff; --ha-card-border-radius: 20px;
    --primary-color: #1d6fd8; --accent-color: #1d6fd8; --success-color: #1a7f37; --error-color: #cf222e;
    --secondary-background-color: #f1f3f4; color: #14181d; background: #eef1f5; padding: 14px; border-radius: 22px;
  }
  .halight {
    --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12);
    --card-background-color: #ffffff; --primary-color: #03a9f4; --accent-color: #03a9f4;
    --secondary-background-color: #f5f5f5; color: #212121; background: #fafafa; padding: 14px; border-radius: 22px;
  }
  table { border-collapse: collapse; color: inherit; font-size: 13px; margin-top: 16px; }
  td, th { border: 1px solid rgba(127,127,127,.35); padding: 4px 8px; text-align: left; vertical-align: top; }
</style>
</head>
<body>
<div id="wrap"><ems-home-card></ems-home-card></div>
<div id="editor"></div>
<script>
  // Stand-in for HA's ha-card: the same box the card gets inside Home Assistant.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host { display: block; position: relative;
        background: var(--ha-card-background, var(--card-background-color, #fff)); border-radius: var(--ha-card-border-radius, 12px);
        box-shadow: 0 1px 3px rgba(0,0,0,.25); color: var(--primary-text-color); }</style><slot></slot>`;
    }
  });
</script>
<script type="module">
const params = new URLSearchParams(location.search);
const wrap = document.getElementById("wrap");
const theme = params.get("theme") || "dark";
wrap.className = theme;
wrap.style.width = `${Number(params.get("w")) || 420}px`;
const lang = params.get("lang") || "de-DE";

const S = (state, attrs = {}) => ({ entity_id: "", state: String(state), attributes: attrs,
  last_changed: new Date().toISOString(), last_updated: new Date().toISOString() });
const EID = "entry-A_";
const now = new Date();
const iso = d => d.toISOString();
const bounds = {
  week: [iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6)), iso(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1))],
  month: [iso(new Date(now.getFullYear(), now.getMonth(), 1)), iso(new Date(now.getFullYear(), now.getMonth() + 1, 1))],
  year: [iso(new Date(now.getFullYear(), 0, 1)), iso(new Date(now.getFullYear() + 1, 0, 1))],
};
const states = {
  "sensor.ems_home_grid_power": S("3.744"),
  "sensor.ems_home_ev_charging_power": S("0"),
  "sensor.ems_home_ev_charging_state": S("idle"),
  "select.ems_home_charge_mode": S("hybrid", { options: ["lock", "grid", "pv", "hybrid"] }),
  "number.ems_home_min_pv_power_quota": S("90", { min: 0, max: 100, step: 10 }),
  "sensor.ems_home_charging_session_duration": S("0"),
  "sensor.ems_home_session_energy": S("0"),
};
const registry = {
  "sensor.ems_home_grid_power": "grid_power_total",
  "sensor.ems_home_ev_charging_power": "ev_charging_power_total",
  "sensor.ems_home_ev_charging_state": "ev_charging_state",
  "select.ems_home_charge_mode": "charge_mode_select",
  "number.ems_home_min_pv_power_quota": "pv_quota_number",
  "sensor.ems_home_charging_session_duration": "evse_session_duration",
  "sensor.ems_home_session_energy": "evse_session_energy",
};
const entities = {};
for (const [id, suffix] of Object.entries(registry)) {
  entities[id] = { entity_id: id, platform: "ems_home", unique_id: EID + suffix, device_id: "dev", config_entry_id: "entry-A" };
}
const energy = [42.5, 38.2, 51.0, 47.3, 33.9, 28.4, 22.1, 19.8, 31.2, 44.6, 58.3, 9.474];
const costs = [12.4, 10.9, 15.2, 13.8, 9.1, 7.6, 5.4, 4.9, 8.7, 13.1, 17.9, 2.639];
const savings = [4.8, 4.1, 6.2, 5.5, 4.3, 3.9, 3.1, 2.7, 4.0, 5.2, 7.1, 0.677];
const months = energy.map((value, i) => {
  const d = new Date(now.getFullYear(), now.getMonth() - 11 + i, 1);
  return { month: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`,
    sessions: Math.max(1, Math.round(value / 9)), energy_kwh: value, cost: costs[i], saved: savings[i] };
});
for (const period of ["week", "month", "year", "total"]) {
  const id = `sensor.ems_home_history_${period}`;
  const factor = { week: 0.25, month: 1, year: 8, total: 12 }[period];
  states[id] = S((energy[11] * factor).toFixed(1), {
    sessions: Math.round(3 * factor), energy_grid_kwh: energy[11] * factor * 0.78, energy_pv_kwh: energy[11] * factor * 0.22,
    cost: costs[11] * factor, saved: savings[11] * factor, avg_kwh: 9.47, price_per_kwh: 0.2785,
    priced_sessions: Math.round(3 * factor),
    by_vehicle: { "SEAT Leon": { sessions: 2, energy_kwh: 6, cost: 1.8 }, "Zoe": { sessions: 1, energy_kwh: 3.4, cost: 0.8 } },
    period_start: period === "total" ? null : bounds[period][0],
    period_end: period === "total" ? null : bounds[period][1],
  });
  entities[id] = { entity_id: id, platform: "ems_home", device_id: "dev", config_entry_id: "entry-A",
    unique_id: `${EID}history_${period}`, translation_key: `history_${period}` };
}
for (const [id, entry] of Object.entries(states)) entry.entity_id = id;
const sessions = Array.from({ length: 6 }, (_, n) => {
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - n, 15, 4);
  return { id: `demo-${n}`, started_at: iso(start), ended_at: iso(new Date(start.getTime() + 3 * 3600e3)),
    duration_s: 10800, energy_wh: 9474 - n * 400, grid_wh: 7539, grid_price: 0.35, pv_price: 0,
    cost: 2.639, saved: 0.677, mode_start: "hybrid", mode_end: "hybrid",
    vehicle: n % 3 === 2 ? "Zoe" : "SEAT Leon", end_reason: "idle", flags: [], estimated: false };
});
const dayBuckets = days => Array.from({ length: days }, (_, n) => {
  const date = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (days - 1 - n));
  const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  const has = n >= days - 6 && n % 2 === 0;
  return { day: key, key, sessions: has ? 1 : 0, energy_kwh: has ? 6 + n % 4 : 0,
    energy_grid_kwh: has ? 4.6 : 0, energy_pv_kwh: has ? 1.4 + n % 4 : 0,
    cost: has ? 1.61 : null, saved: has ? 0.49 : null };
});
const call = async data => {
  const vehicle = data.vehicle;
  const picked = sessions.filter(s => !vehicle || s.vehicle === vehicle);
  return { response: { sessions: picked.slice(data.offset || 0, (data.offset || 0) + (data.limit || 20)),
    count: picked.length, offset: data.offset || 0, limit: data.limit || 20, months,
    ...(data.resolution === "day" ? { buckets: dayBuckets(data.days || 30) } : {}) } };
};
const hass = {
  states, entities, locale: { language: lang }, language: lang.slice(0, 2),
  themes: { darkMode: theme === "dark" },
  callWS: async message => call(message.service_data || {}),
  callService: async (domain, service, data) => {
    if (service === "export_history") return { response: { url: "#", rows: 6, expires_at: new Date(Date.now() + 3e5).toISOString() } };
    return call(data || {});
  },
};

await import("../custom_components/ems_home/frontend/ems-home-card.js");
const card = document.querySelector("ems-home-card");
const config = { type: "custom:ems-home-card", title: "eMS Home", layout: params.get("layout") || "full", price: 0.35 };
if (params.get("history")) config.history = JSON.parse(params.get("history"));
if (params.get("show_history") === "0") config.show_history = false;
try {
  card.setConfig(config);
} catch (error) {
  document.title = `config error: ${error.message}`;
  wrap.insertAdjacentHTML("beforeend", `<pre style="color:#f85149">${error.message}</pre>`);
}
card.hass = hass;
if (params.get("open") === "1") {
  setTimeout(() => card.shadowRoot.querySelector("[data-history]")?.click(), 150);
}

if (params.get("editor") === "1") {
  const editor = document.createElement("ems-home-card-editor");
  editor.hass = hass;
  editor.setConfig(config);
  const flat = [];
  const walk = (schema, prefix) => {
    for (const entry of schema) {
      const name = prefix ? `${prefix}.${entry.name}` : entry.name;
      flat.push({ name, label: editor._t(entry.label_key || entry.name),
        helper: (editor.shadowRoot.querySelector("ha-form")?.computeHelper?.(entry)) || "",
        type: entry.type || Object.keys(entry.selector || {})[0] || "",
        options: (entry.selector?.select?.options || []).map(option => option.label).join(" / ") });
      if (entry.schema) walk(entry.schema, name);
    }
  };
  document.getElementById("editor").appendChild(editor);
  walk(editor._schema(), "");
  const data = editor.shadowRoot.querySelector("ha-form")?.data || {};
  const rows = flat.map(row => `<tr><td>${row.name}</td><td>${row.label}</td><td>${row.type}</td>`
    + `<td>${row.options}</td><td>${row.helper}</td>`
    + `<td>${JSON.stringify(row.name.split(".").reduce((value, key) => value?.[key], data) ?? "")}</td></tr>`).join("");
  document.getElementById("editor").insertAdjacentHTML("beforeend",
    `<table class="${theme}"><tr><th>Schlüssel</th><th>Beschriftung</th><th>Typ</th><th>Optionen</th><th>Hilfe</th><th>Wert im Editor</th></tr>${rows}</table>`);
}
</script>
</body>
</html>
