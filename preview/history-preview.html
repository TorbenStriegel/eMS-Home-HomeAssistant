<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>eMS Home – Verlauf Vorschau</title>
<script>
  if (location.search.includes("light")) {
    const css = `
      --preview-bg: #f2f4f7; --preview-card: #ffffff; --preview-text: #1c1f26;
      --primary-color: #03a9f4; --accent-color: #03a9f4; --success-color: #4caf50;
      --error-color: #db4437; --primary-text-color: #1c1f26; --secondary-text-color: #5f6368;
      --divider-color: #dadce0; --secondary-background-color: #f1f3f4;
      --ha-card-background: #ffffff; --card-background-color: #ffffff;`;
    document.addEventListener("DOMContentLoaded", () => {
      const style = document.createElement("style");
      style.textContent = `:root { ${css} }`;
      document.head.appendChild(style);
    });
  }
</script>
<style>
  :root {
    --preview-bg: #111318;
    --primary-color: #4f9cf9; --accent-color: #4f9cf9; --success-color: #4caf7d;
    --error-color: #e05a5a; --primary-text-color: #e6e8eb; --secondary-text-color: #9aa0a6;
    --divider-color: #3a3f45; --secondary-background-color: #24272e;
    --ha-card-background: #1c1f26; --card-background-color: #1c1f26;
  }
  body.phone { grid-template-columns: minmax(0, 1fr); max-width: 420px; }
  body.phone .card { width: 100%; }
  body { margin: 0; padding: 18px; background: var(--preview-bg); color: var(--preview-text, #e6e8eb);
         font-family: "Roboto", "Helvetica Neue", Arial, sans-serif; display: grid; gap: 18px;
         grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .card { background: var(--preview-card, #1c1f26); border-radius: 14px; overflow: hidden; }
  h2 { margin: 0; font-size: .8rem; color: #9aa0a6; padding: 10px 14px 0; font-weight: 500; }
</style>
</head>
<body>
<div class="card"><h2>Diagrammkarte · kWh</h2><ems-home-history-chart></ems-home-history-chart></div>
<div class="card"><h2>Diagrammkarte · bezahlt / vermieden</h2><ems-home-history-chart></ems-home-history-chart></div>
<div class="card"><h2>Verlaufskarte</h2><ems-home-history-card></ems-home-history-card></div>

<script type="module">
const NOW = new Date(2026, 10, 24, 12);
const monthKeys = Array.from({length: 12}, (_, n) => {
  const d = new Date(NOW.getFullYear(), NOW.getMonth() - 11 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
});
const energy = [42.5, 38.2, 51.0, 47.3, 33.9, 28.4, 22.1, 19.8, 31.2, 44.6, 58.3, 9.474];
const costs = [12.4, 10.9, 15.2, 13.8, 9.1, 7.6, 5.4, 4.9, 8.7, 13.1, 17.9, 2.639];
const savings = [4.8, 4.1, 6.2, 5.5, 4.3, 3.9, 3.1, 2.7, 4.0, 5.2, 7.1, 0.677];
const months = monthKeys.map((month, i) => ({
  month, sessions: i === 11 ? 1 : Math.max(1, Math.round(energy[i] / 9)),
  energy_kwh: energy[i], cost: costs[i], saved: savings[i],
}));

const state = (value, attributes) => ({entity_id: "", state: String(value), attributes, last_changed: NOW.toISOString(), last_updated: NOW.toISOString()});
const sessions = [{
  id: "demo-1", started_at: "2026-11-24T15:04:31Z", ended_at: "2026-11-24T18:12:06Z",
  last_flow_at: "2026-11-24T18:06:56Z", duration_s: 10900, energy_wh: 9474, grid_wh: 7539,
  grid_price: 0.35, pv_price: 0.0, cost: 2.639, saved: 0.677, mode_start: "grid",
  mode_end: "grid", vehicle: "Seat", end_reason: "idle", flags: [], estimated: true,
}];
const dayBuckets = (days) => Array.from({length: days}, (_, n) => {
  const date = new Date(NOW.getFullYear(), NOW.getMonth(), NOW.getDate() - (days - 1 - n));
  const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
  const hasData = n >= days - 4;
  return {day: key, key, sessions: hasData ? 1 : 0,
    energy_kwh: hasData ? 2.4 + n % 3 : 0,
    energy_grid_kwh: hasData ? 1.8 : 0, energy_pv_kwh: hasData ? 0.6 : 0,
    cost: hasData ? 0.85 : null, saved: hasData ? (n === days - 2 ? 0 : 0.21) : null};
});
const dark = !location.search.includes("light");
const hass = { themes: {darkMode: dark},language: "de", locale: {language: "de-DE"}, states: {}, entities: {},
  callWS: async message => {
    const data = message.service_data || {};
    const buckets = data.resolution === "day" ? dayBuckets(data.days || 30) : months;
    return {response: {sessions, count: 1, offset: 0, limit: 20, months, buckets}};
  }};
for (const [period, index] of [["week", 11], ["month", 11], ["year", 11], ["total", 11]]) {
  const id = `sensor.ems_home_history_${period}`;
  hass.states[id] = state(energy[index], {
    sessions: months[index].sessions, energy_grid_kwh: energy[index] * 0.78, energy_pv_kwh: energy[index] * 0.22,
    cost: costs[index], saved: savings[index], avg_kwh: 9.47, price_per_kwh: 0.2785, priced_sessions: months[index].sessions,
    by_vehicle: {Seat: {sessions: 1, energy_kwh: energy[index], cost: costs[index]}},
    period_start: period === "total" ? null : "2026-11-01T00:00:00+01:00",
    period_end: period === "total" ? null : "2026-12-01T00:00:00+01:00",
  });
  hass.entities[id] = {entity_id: id, platform: "ems_home", device_id: "dev", translation_key: `history_${period}`};
}
await import("../custom_components/ems_home/frontend/ems-home-history-cards.js");
const cards = [...document.querySelectorAll("ems-home-history-chart, ems-home-history-card")];
const params = new URLSearchParams(location.search);
cards[0].setConfig({period: "month"});
// The second card mirrors the query so layout variants can be compared side by side.
cards[1].setConfig({
  period: params.get("period") || "month",
  metric: params.get("metric") || "cost",
  layout: params.get("layout") || "full",
  show_sessions: params.get("sessions") === "1",
});
// The full history card follows the same query: that is the layout under test.
cards[2].setConfig({
  period: params.get("period") || "month",
  metric: params.get("metric") || "cost",
  layout: params.get("layout") || "full",
  show_sessions: params.get("sessions") === "1",
});
for (const card of cards) card.hass = hass;
const width = new URLSearchParams(location.search).get("w");
if (width) {
  document.body.classList.add("phone");
  document.body.style.maxWidth = `${width}px`;
  document.body.style.padding = "8px";
  document.body.style.margin = "0";
}

if (location.search.includes("resize")) {
  // Narrow the card after the first render, then look at the scroll position without
  // dispatching any hass update.
  setTimeout(() => {
    document.body.style.maxWidth = "360px";
    for (const card of cards) card.style.width = "360px";
    setTimeout(() => {
      const report = cards.map(card => {
        const chart = card.shadowRoot.querySelector(".history-chart");
        return {metric: card._history?.metric, left: Math.round(chart.scrollLeft),
                width: Math.round(chart.clientWidth), scroll: Math.round(chart.scrollWidth)};
      });
      // The newest bar is the last column's right edge.
      const last = [...cards[1].shadowRoot.querySelectorAll(".history-column")].at(-1);
      report.push({lastRight: Math.round(last.getBoundingClientRect().right),
                   chartRight: Math.round(cards[1].shadowRoot.querySelector(".history-chart").getBoundingClientRect().right)});
      document.title = JSON.stringify(report);
    }, 600);
  }, 1200);
}

if (location.search.includes("debug")) {
  setTimeout(() => {
    document.title = JSON.stringify(cards.map(card => ({
      metric: card._history?.metric, months: card._history?.months?.length,
      height: Math.round(card.getBoundingClientRect().height),
      cols: (() => {
        const chart = card.shadowRoot?.querySelector(".history-chart");
        const list = [...(chart?.querySelectorAll(".history-column") || [])];
        if (!chart || !list.length) return null;
        const rect = chart.getBoundingClientRect();
        const first = list[0].getBoundingClientRect(), last = list.at(-1).getBoundingClientRect();
        const baseline = getComputedStyle(list[0].querySelector(".history-track")).borderBottomWidth;
        return {count: list.length, chartWidth: Math.round(rect.width),
          firstX: Math.round(first.left - rect.left), lastRight: Math.round(last.right - rect.left),
          colWidth: Math.round(first.width * 10) / 10, baseline};
      })(),
      parts: Object.fromEntries(["history-header","history-kpis","history-chart","history-selection","history-note","history-list-wrap"]
        .map(k => [k, Math.round((card.shadowRoot?.querySelector("." + k)?.getBoundingClientRect().height) || 0)])),
      error: card._history?.error, trusted: card._history?.source?.trusted,
      columns: card.shadowRoot?.querySelectorAll(".history-column").length || 0,
      tracks: [...(card.shadowRoot?.querySelectorAll(".history-track") || [])].slice(0, 2).map(t => Math.round(t.getBoundingClientRect().height)),
      bars: [...(card.shadowRoot?.querySelectorAll(".history-bar") || [])].slice(0, 3).map(b => [b.getAttribute("style"), Math.round(b.getBoundingClientRect().height)]),
      layout: (() => {
        const kpis = card.shadowRoot?.querySelector(".history-kpis");
        const items = [...(card.shadowRoot?.querySelectorAll(".history-kpi") || [])];
        return {
          cardWidth: Math.round(card.getBoundingClientRect().width),
          kpiOverflow: kpis ? kpis.scrollWidth - kpis.clientWidth : null,
          kpiColumns: kpis ? getComputedStyle(kpis).gridTemplateColumns : null,
          viewWidth: Math.round((card.shadowRoot?.querySelector(".history-view")?.getBoundingClientRect().width) || 0),
          kpiWidths: items.map(i => Math.round(i.getBoundingClientRect().width)),
          labelOverflow: items.map(i => {
            const label = i.querySelector("small");
            return label ? label.scrollWidth - label.clientWidth : 0;
          }),
          chartOverflow: (() => { const c = card.shadowRoot?.querySelector(".history-chart"); return c ? c.scrollWidth - c.clientWidth : null; })(),
          barShadow: (() => {
            const bar = card.shadowRoot?.querySelector(".history-bar > div");
            return bar ? getComputedStyle(bar).boxShadow : null;
          })(),
          dayLabelClipped: [...(card.shadowRoot?.querySelectorAll(".history-column > span") || [])].filter(span => span.scrollWidth > span.clientWidth + 1).length,
          kpiLabelLines: [...(card.shadowRoot?.querySelectorAll(".history-kpi > small") || [])].map(label => Math.round(label.getBoundingClientRect().height)),
          caption: card.shadowRoot?.querySelector("figcaption")?.textContent,
        };
      })(),
      wide: (() => {
        const width = card.getBoundingClientRect().width;
        const out = [];
        for (const el of card.shadowRoot?.querySelectorAll("*") || []) {
          if (el.scrollWidth > width + 1) out.push(`${el.tagName.toLowerCase()}.${el.className}:${el.scrollWidth}`);
        }
        return out.slice(0, 5);
      })(),
      lastPair: (() => {
        const cols = [...(card.shadowRoot?.querySelectorAll(".history-column") || [])];
        const col = cols[cols.length - 1];
        const r = el => el ? [Math.round(el.getBoundingClientRect().x), Math.round(el.getBoundingClientRect().width), Math.round(el.getBoundingClientRect().height)] : null;
        return {paid: r(col?.querySelector(".history-paid")), avoided: r(col?.querySelector(".history-avoided")), label: col?.getAttribute("aria-label")};
      })(),
    })));
  }, 500);
}
</script>
</body>
</html>
